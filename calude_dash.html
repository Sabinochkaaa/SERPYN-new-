async function fetchStorageScreenshots(idOrUsername){

  keys = [...new Set(keys)].slice(0,3);

function getScreenshotsFromDetail(detail){
  if(!detail) return [];
  let out = [];
  const push = (v)=>{ if(!v) return; if(typeof v==='string'){ const u=cleanStorageUrl(v); if(u) out.push(u); } else if(typeof v==='object'){ const raw = v.storage_url||v.original_url||v.url||v.path||v.public_url||v.publicUrl||v.screenshot_url||v.screenshot_path||v.image_url||v.photo_url||v.media_url||v.file_url||v.storage_path||null; if(raw){ const u=cleanStorageUrl(typeof raw==='string'?raw:String(raw)); if(u) out.push(u); } } };
  const directFields = ['screenshots','screenshot_urls','screenshots_urls','images','media','photos','files','screenshot','image','photo'];

function getLinksFromDetail(detail){
  if(!detail) return {usernames:[], invites:[], http:[], forwards:[], primary:null};
  let usernames=[], invites=[], http=[], forwards=[]; let primary=null;
  const addHttp = (v)=>{ if(!v||typeof v!=='string') return; const s=v.trim(); if(!s) return; http.push(s); if(!primary && (s.includes('t.me/')||s.includes('http'))) primary=s; };

  if(Array.isArray(detail.posts)) detail.posts.forEach(p=>{ if(p.url) addHttp(p.url); if(p.external_id && String(p.external_id).startsWith('http')) addHttp(p.external_id); if(p.link) addHttp(p.link); });
  ['evidence','evidences','proofs'].forEach(k=>{ const arr = detail[k]; if(Array.isArray(arr)) arr.forEach(ev=>{ if(ev?.url) addHttp(ev.url); if(ev?.original_url) addHttp(ev.original_url); if(ev?.link) addHttp(ev.link); }); });
  const l = detail.links||detail.platform_meta?.links||detail.channel?.platform_meta?.links||{};

// ── Построение "предполагаемой" ссылки, если backend её не прислал ──────────

function buildFallbackLink(sourceType, rawUsername, externalId){
  const handle = extractHandle(rawUsername) || extractHandle(externalId);
  const type = String(sourceType||'').toUpperCase();
  if(!handle) {
    if(externalId && String(externalId).startsWith('http')) return String(externalId);
    if(rawUsername && String(rawUsername).startsWith('http')) return String(rawUsername);
    return null;
  }
  switch(type){
    case 'TELEGRAM': return `https://t.me/${handle}`;
    case 'YOUTUBE': return `https://www.youtube.com/@${handle}`;
    case 'TIKTOK': return `https://www.tiktok.com/@${handle}`;
    case 'INSTAGRAM': return `https://www.instagram.com/${handle}`;
    case 'THREADS': return `https://www.threads.net/@${handle}`;
    case 'TWITTER': case 'X': return `https://x.com/${handle}`;
    case 'FACEBOOK': return `https://www.facebook.com/${handle}`;
    case 'VK': return `https://vk.com/${handle}`;
    case 'DISCORD': return `https://discord.gg/${handle}`;
    case 'WHATSAPP': return `https://wa.me/${handle}`;
    case 'LINKEDIN': return `https://www.linkedin.com/in/${handle}`;
    default: return null;
  }
}
function getPrimaryLink(d, detail){
  if(detail){ const ld = getLinksFromDetail(detail); if(ld.primary) return ld.primary; if(ld.http.length>0) return ld.http[0]; }
  if(d.url && d.url.startsWith('http')) return d.url;

  // Фолбэк: собираем ссылку сами из типа источника + username/external_id
  const fallback = buildFallbackLink(d.source_type, d.rawUsername||d.username, d.external_id||d.id);

        <h2 style="font-size:10.5pt; font-weight:700; color:#0f172a; text-transform:uppercase; margin:10px 0 6px 0; padding-left:8px; border-left:3.5px solid #2563eb; letter-spacing:0.3px; position:relative; z-index:1;">5. Экспертное заключение</h2>

        <div style="margin-top:15px; padding-top:8px; border-top:1px solid #cbd5e1; font-size:7.5pt; color:#94a3b8; text-align:justify; position:relative; z-index:1;"><b>Конфиденциально</b> | Сгенерировано аналитической платформой SERPYN OSINT | Документ предназначен для внутреннего использования и передачи в правоохранительные органы.</div>
      </div>
    `;

    const container = document.createElement('div');
    container.className = 'pdf-export-container';
    container.innerHTML = htmlContent;
    document.body.appendChild(container);

    try {
      // Ждём загрузки картинок (логотип), иначе html2canvas может
      // отрендерить страницу раньше, чем логотип прогрузится => пустой лист.
      await waitForImages(container);
      await new Promise(r => setTimeout(r, 50)); // даём браузеру один кадр на layout

      const canvas = await window.html2canvas(container, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        imageTimeout: 5000,
        logging: false,
      });

      if (!canvas.width || !canvas.height) {
        throw new Error('html2canvas вернул пустой canvas (0x0)');
      }

      const imgData = canvas.toDataURL('image/png');
      const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidthMm = pageWidth;
      const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;

      if (imgHeightMm <= pageHeight) {
        // Помещается на одну страницу
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidthMm, imgHeightMm);
      } else {
        // Разбиваем длинное досье на несколько страниц A4
        let heightLeftMm = imgHeightMm;
        let positionMm = 0;
        pdf.addImage(imgData, 'PNG', 0, positionMm, imgWidthMm, imgHeightMm);
        heightLeftMm -= pageHeight;
        while (heightLeftMm > 0) {
          positionMm -= pageHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, positionMm, imgWidthMm, imgHeightMm);
          heightLeftMm -= pageHeight;
        }
      }
      pdf.save(`dossier_${d.id}.pdf`);
    } catch (err) {
      console.error('PDF generation error:', err);
      alert('Не удалось сгенерировать PDF: ' + (err?.message || err) + '\nПроверьте консоль браузера (F12).');
    } finally {
      document.body.removeChild(container);
      setIsGeneratingPDF(false);
    }
  }, [d, detail, screenshots, msgs, isGeneratingPDF, waitForImages]);

  return(
    <div style={{position:'fixed',inset:0,zIndex:50,background:'rgba(0,0,0,.55)',backdropFilter:'blur(2px)',display:'flex',flexDirection:'column'}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div style={{flex:1,overflow:'auto',background:bg}}>
        {/* Header */}
        <div style={{position:'sticky',top:0,zIndex:10,background:cardBg,borderBottom:`1px solid ${border}`,padding:'12px 24px',display:'flex',alignItems:'center',gap:12,overflow:'hidden'}}>
          <button onClick={onClose} style={{width:32,height:32,border:`1px solid ${border}`,borderRadius:8,background:'transparent',color:dark?'#fff':'#000',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'}}>✕</button>
          <span style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',maxWidth:380,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Досье · @{d.displayUsername||cleanUsername(d.username)}</span>
          <Dot verdict={d.verdict}/><span style={{fontSize:12,fontWeight:700,color:vc(d.verdict),textTransform:'uppercase'}}>{d.verdict}</span>
          
          <div style={{marginLeft:'auto',flexShrink:0, display:'flex', gap:8}}>
            {/* Кнопка включения редактирования */}
            <button onClick={()=>setIsEditMode(!isEditMode)} style={{padding:'6px 12px', borderRadius:8, border:`1px solid ${border}`, background: isEditMode ? '#00C950' : 'transparent', color: isEditMode ? '#fff' : (dark?'#fff':'#000'), fontSize:11, fontFamily:'inherit', fontWeight:600, cursor:'pointer'}}>
              {isEditMode ? '✏️ Готово' : '✏️ Ред.'}
            </button>

            {/* Кнопка PDF */}
            <button onClick={handleDownloadPDF} disabled={isGeneratingPDF} style={{padding:'6px 12px',borderRadius:8,background:'#2563eb',color:'#fff',fontSize:11,textDecoration:'none',fontFamily:'inherit',fontWeight:600,border:'none',opacity:isGeneratingPDF?0.5:1}}>{isGeneratingPDF ? 'Генерация...' : '⬇ PDF'}</button>
            
            {/* Кнопка открыть */}
            {(()=>{
              const primaryLink = getPrimaryLink(d, detail) || d.url;
              return primaryLink ? (
              <a href={primaryLink} target="_blank" rel="noopener noreferrer" style={{padding:'6px 14px',borderRadius:8,background:dark?'#fff':'#000',color:dark?'#000':'#fff',fontSize:11,textDecoration:'none',fontFamily:'inherit',fontWeight:600,display:'inline-block',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Открыть ↗</a>
            ):(<span title={`Ссылка не найдена: нет url в БД и не удалось собрать из username (@${d.displayUsername||cleanUsername(d.username)}) для типа ${d.source_type}`} style={{padding:'6px 14px',borderRadius:8,border:`1px solid ${border}`,fontSize:11,color:muted}}>Нет ссылки</span>
            )})()}
          </div>
        </div>
 
        {/* Body */}
        <div style={{maxWidth:1200,margin:'0 auto',padding:24,display:'grid',gridTemplateColumns:'1.4fr 0.9fr',gap:20}}>
          {/* Left */}
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,overflow:'hidden'}}>
              <div style={{height:150,background:`linear-gradient(135deg,${vc(d.verdict)}44,#111)`,position:'relative'}}>
                <div style={{position:'absolute',bottom:16,left:16,right:16,color:'#fff'}}>
                  <div style={{fontSize:20,fontWeight:700}}>{d.title}</div>
                  <div style={{fontSize:12,opacity:.8,marginTop:4}}>@{d.username}{d.participants>0&&` · ${d.participants.toLocaleString()} уч.`} · {d.source_type}</div>
                </div>
              </div>
              {d.description&&<div style={{padding:'12px 16px'}}><div style={{fontSize:10,color:muted,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:4}}>Описание</div><div style={{fontSize:12,lineHeight:1.5}}>{d.description}</div></div>}
            </div>
 
            <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>Детекция</div><span style={{...sc(d.riskPct),padding:'4px 12px',borderRadius:8,fontSize:11,fontWeight:700,fontFamily:'inherit'}}>{d.verdict.toUpperCase()}</span></div>
              <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
                <div><div style={{fontSize:10,color:muted,textTransform:'uppercase',marginBottom:4}}>Risk Score</div><div style={{fontSize:40,fontWeight:700,color:vc(d.verdict),letterSpacing:'-0.02em'}}>{d.riskPct}</div><div style={{marginTop:8,height:8,borderRadius:6,background:dark?'#2a2a2a':'#f0f0f0',overflow:'hidden',width:120}}><div style={{height:'100%',background:vc(d.verdict),width:`${d.riskPct}%`,borderRadius:6,transition:'width .7s'}}/></div></div>
                <div style={{flex:1}}>
                  {d.cats.length>0&&<div style={{marginBottom:10}}><div style={{fontSize:10,color:muted,textTransform:'uppercase',marginBottom:4}}>Категории</div><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{d.cats.map(c=><span key={c} style={{fontSize:10,padding:'2px 8px',border:`1px solid ${border}`,borderRadius:6,textTransform:'uppercase'}}>{c}</span>)}</div></div>}
                  {d.kws.length>0&&<div style={{marginBottom:10}}><div style={{fontSize:10,color:muted,textTransform:'uppercase',marginBottom:4}}>Ключевые маркеры</div><div style={{display:'flex',flexWrap:'wrap',gap:4}}>{d.kws.map(k=><span key={k} style={{fontSize:10,padding:'2px 8px',borderRadius:6,background:'rgba(255,45,45,.1)',color:'#FF2D2D',border:'1px solid rgba(255,45,45,.2)'}}>{k}</span>)}</div></div>}
                  <div><div style={{fontSize:10,color:muted,textTransform:'uppercase',marginBottom:4}}>Причина</div><div style={{fontSize:12,lineHeight:1.5,borderLeft:`3px solid ${vc(d.verdict)}`,paddingLeft:10}}>{d.reason}</div></div>
                </div>
              </div>
            </div>
 
            {/* Сообщения */}
            <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>Сообщения ({msgs.length})</div>
                <div style={{display:'flex',gap:4,alignItems:'center'}}>
                  <button disabled={page===0} onClick={()=>setPage(p=>p-1)} style={{width:26,height:26,border:`1px solid ${border}`,borderRadius:6,background:'transparent',color:dark?'#fff':'#000',opacity:page===0?.3:1,fontFamily:'inherit',fontSize:13}}>←</button>
                  <span style={{fontSize:11,color:muted,minWidth:40,textAlign:'center'}}>{page+1}/{totalPages}</span>
                  <button disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)} style={{width:26,height:26,border:`1px solid ${border}`,borderRadius:6,background:'transparent',color:dark?'#fff':'#000',opacity:page>=totalPages-1?.3:1,fontFamily:'inherit',fontSize:13}}>→</button>
                </div>
              </div>
              {msgs.length===0&&<div style={{color:muted,fontSize:12,textAlign:'center',padding:'20px 0'}}>Сообщений нет</div>}
              {msgs.slice(page*5,page*5+5).map((m,i)=>(
                <div key={m.id||i} style={{border:`1px solid ${border}`,borderRadius:8,padding:10,marginBottom:8}}>
                  <div style={{display:'flex',gap:8,fontSize:10,color:muted,marginBottom:4,flexWrap:'wrap'}}>{m.date&&<span>{new Date(m.date).toLocaleString('ru')}</span>}{m.views>0&&<span>👁 {m.views}</span>}{m.forwards>0&&<span>↗ {m.forwards}</span>}</div>
                  <div style={{fontSize:12,lineHeight:1.5}}>{m.text||<span style={{color:muted,fontStyle:'italic'}}>— пусто —</span>}</div>
                </div>
              ))}
            </div>
 
            {/* ЗАМЕНА JSON НА КРАСИВОЕ ДОСЬЕ */}
            {(dLoading||detail)&&(
              <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}>
                <div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}}>
                  Полное досье /channel/{d.id}/dossier
                </div>
                {dLoading&&<Spinner/>}
                {detail&&!dLoading&&(
                  <DossierView d={d} detail={detail} screenshots={screenshots} msgs={msgs} isEditMode={isEditMode} />
                )}
              </div>
            )}
          </div>
 
          {/* Right (Скриншоты, связи, действия) */}
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>Скриншоты {screenshots.length>0&&`(${screenshots.length})`}</div>
                <label style={{fontSize:10,padding:'4px 8px',border:`1px solid ${border}`,borderRadius:6,cursor:'pointer',background:uploading?'#eee':'transparent',opacity:uploading?0.5:1}}>{uploading?'Загрузка...':'📷 Загрузить'}<input type="file" accept="image/*" style={{display:'none'}} disabled={uploading} onChange={async e=>{const file=e.target.files?.[0]; if(!file) return; setUploading(true); const url = await uploadViaServer(file, `${d.id}_${Date.now()}.png`); setUploading(false); if(url){ setStorageShots(prev=>[url, ...prev]); } else { alert('Не удалось загрузить'); }}}/></label>
              </div>
              {dLoading&&<Spinner/>}
              {!dLoading&&screenshots.length===0&&(<div style={{color:muted,fontSize:11,textAlign:'center',padding:'16px 0'}}>Скриншотов в базе не найдено<br/><span style={{fontSize:9}}>Storage: {SCREENSHOT_BUCKET}/{d.id}</span></div>)}
              {screenshots.length>0&&(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>{screenshots.map((url,i)=>(<a key={i} href={url} target="_blank" rel="noopener noreferrer" style={{aspectRatio:'4/3',borderRadius:8,border:`1px solid ${border}`,overflow:'hidden',display:'block',background:dark?'#1a1a1a':'#f0f0f0',position:'relative'}}><img src={url} alt={`screenshot ${i+1}`} loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} onError={e=>{ const p=e.currentTarget.parentElement; e.currentTarget.style.display='none'; if(p){p.style.display='flex';p.style.alignItems='center';p.style.justifyContent='center';p.innerHTML='<span style=\'font-size:9px;color:'+muted+'\'>не загрузилось</span>';} }}/></a>))}</div>)}
              <div style={{marginTop:10,fontSize:9,color:muted}}>Источник: evidence.storage_url + /channel/{d.id}/dossier</div>
            </div>
 
            {(()=>{ /* Блок связей */ 
              let merged = {usernames:[...(d.links.usernames||[])], invites:[...(d.links.invites||[])], http:[...(d.links.http||[])], forwards:[...(d.forwards_from||[])]};
              let primary=null;
              if(detail){ const fromDetail = getLinksFromDetail(detail); merged.usernames.push(...fromDetail.usernames); merged.invites.push(...fromDetail.invites); merged.http.push(...fromDetail.http); merged.forwards.push(...fromDetail.forwards); primary=fromDetail.primary; }
              const msgHttp = d.messages.flatMap(m=>[...(m.http_links||[]), m.url||[]]).filter(Boolean);
              merged.http.push(...msgHttp);
              merged.usernames = [...new Set(merged.usernames.map(s=>{ const h=extractHandle(String(s)); return h||String(s).replace('@','').split('?')[0].trim(); }).filter(Boolean))];
              merged.invites = [...new Set(merged.invites.filter(Boolean))];
              merged.http = [...new Set(merged.http.filter(Boolean))];
              merged.forwards = [...new Set(merged.forwards.map(s=> typeof s==='string'?s:(s?.username||s?.name||'')).filter(Boolean))];
              const hasAny = merged.usernames.length+merged.invites.length+merged.http.length+merged.forwards.length>0;
              if(!hasAny) return (<div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}}>Связи из БД</div><div style={{fontSize:11,color:muted}}>Ссылок нет в БД</div></div>);
              return (<div style={{background:cardBg,border:`2px solid ${d.verdict==='dangerous'?'#FF2D2D':border}`,borderRadius:12,padding:20}}><div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}}>Связи из БД ({merged.usernames.length+merged.invites.length+merged.http.length})</div>
                {[{label:'Ссылки на каналы',items:merged.usernames,color:'#FF2D2D',isLink:false},{label:'Инвайт ссылки',items:merged.invites,color:'#FFB800',isLink:true},{label:'Внешние ссылки',items:merged.http,color:'#888',isLink:true},{label:'Форварды из',items:merged.forwards,color:'#00C950',isLink:false}].filter(s=>s.items.length>0).map(s=>(
                  <div key={s.label} style={{marginBottom:12}}><div style={{fontSize:10,color:muted,textTransform:'uppercase',marginBottom:6}}><span style={{color:s.color}}>●</span> {s.label} [{s.items.length}]</div>
                    {s.items.slice(0,20).map((it,i)=>{ const str=String(it); const isHttp=str.startsWith('http'); const href=isHttp?str:`https://t.me/${str.replace('@','')}`; return (<a key={i} href={href} target="_blank" rel="noopener noreferrer" title={str} style={{display:'block',fontSize:11,padding:'5px 8px',border:`1px solid ${border}`,borderRadius:6,marginBottom:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:'none',color:dark?'#fff':'#000',background:dark?'#1a1a1a':'#fafafa'}}>{isHttp?cleanUrlForDisplay(str):`@${cleanUsername(str)}`} ↗</a>); })}
                  </div>))}
                <div style={{marginTop:6}}><a onClick={(e)=>{e.preventDefault();}} href="#graph" style={{fontSize:10,color:'#2563eb',textDecoration:'none'}}>ⓘ Полная карта связей — на вкладке «Граф связей»</a></div>
                </div>);
            })()}
 
            <div style={{background:dark?'#fff':'#000',borderRadius:12,padding:20,color:dark?'#000':'#fff'}}>
              <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.15em',opacity:.6,marginBottom:12}}>Действия</div>
              {(()=>{ const primaryLink = getPrimaryLink(d, detail) || d.url; return primaryLink ? (<a href={primaryLink} target="_blank" rel="noopener noreferrer" style={{display:'block',textAlign:'center',padding:'10px',borderRadius:8,background:dark?'#000':'#fff',color:dark?'#fff':'#000',fontSize:12,textDecoration:'none',fontFamily:'inherit',fontWeight:700,marginBottom:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Открыть ↗</a>):(<div style={{textAlign:'center',padding:'10px',borderRadius:8,border:'1px solid rgba(255,255,255,.2)',fontSize:11,opacity:.6,marginBottom:8}}>Ссылка не найдена в БД</div>)})()}
              <div style={{fontSize:10,lineHeight:1.8,opacity:.6,marginTop:12}}><div>id: {d.id}</div><div>source: {d.source_type}</div><div>posts: {d.posts_count}</div></div>
            </div>
 
            <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:16}}>
              <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em',color:muted,marginBottom:8}}>Источник данных</div>
              <div style={{fontSize:10,color:muted,lineHeight:1.8}}><div>GET /channels?limit=200</div><div>GET /suspicious?limit=500</div><div>GET /channel/{d.id}/dossier</div><div style={{marginTop:6,color:'#00C950'}}>✓ Реальные данные</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ГРАФ СВЯЗЕЙ ──────────────────────────────────────────────────────────────
// Идея: backend уже хранит универсальные "сущности" (entities: CHANNEL, PERSON,
// ACCOUNT, WALLET, PHONE, DOMAIN, ...) и "связи" между ними (relations: кто кого
// продвигает/владеет/использует и т.д.) — см. таблицы entities/relations в
// schema.sql и эндпоинт GET /graph в main.py. Этот компонент просто визуализирует
// то, что туда прислал парсер вместе с /ingest (поля entities[] и relations[] —
// см. example_ingest.json).
const ENTITY_TYPE_META = {
  CHANNEL:         {label:'Канал / страница',   color:'#2563eb'},
  ACCOUNT:         {label:'Аккаунт (иная платформа)', color:'#7c3aed'},
  PERSON:          {label:'Человек',             color:'#f97316'},
  COMPANY:         {label:'Компания',            color:'#6366f1'},
  PROJECT:         {label:'Проект/схема',        color:'#14b8a6'},
  WEBSITE:         {label:'Сайт',                color:'#64748b'},
  DOMAIN:          {label:'Домен',               color:'#64748b'},
  PHONE:           {label:'Телефон',             color:'#10b981'},
  EMAIL:           {label:'Email',               color:'#06b6d4'},
  BANK_CARD:       {label:'Банковская карта',    color:'#ec4899'},
  IBAN:            {label:'IBAN',                color:'#ec4899'},
  WALLET:          {label:'Крипто-кошелёк',      color:'#f59e0b'},
  USERNAME:        {label:'Username',            color:'#8b5cf6'},
  ADDRESS:         {label:'Адрес',               color:'#84cc16'},
  TELEGRAM_BOT:    {label:'Telegram-бот',        color:'#0ea5e9'},
  WHATSAPP_NUMBER: {label:'WhatsApp',            color:'#22c55e'},
  SOCIAL_MEDIA:    {label:'Соцсеть',             color:'#a855f7'},
  CRYPTO_EXCHANGE: {label:'Крипто-биржа',        color:'#eab308'},
  OTHER:           {label:'Другое',              color:'#94a3b8'},
};
const typeMeta = (t)=> ENTITY_TYPE_META[t] || ENTITY_TYPE_META.OTHER;

function GraphView({dark,border,cardBg,muted,onOpenSource}){
  const wrapRef = useRef(null);
  const svgRef = useRef(null);
  const [dims,setDims] = useState({w:900,h:640});
  const [raw,setRaw] = useState({nodes:[],edges:[]});
  const [wallets,setWallets] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState(null);
  const [minRisk,setMinRisk] = useState(0);
  const [selectedTypes,setSelectedTypes] = useState(null); // null = все
  const [search,setSearch] = useState('');
  const [selectedId,setSelectedId] = useState(null);
  const [entityDetail,setEntityDetail] = useState(null);
  const [detailLoading,setDetailLoading] = useState(false);
  const [reveal,setReveal] = useState(false);
  const [showHelp,setShowHelp] = useState(false);

  const load = useCallback(()=>{
    setLoading(true); setError(null);
    Promise.all([
      apiFetch('/graph?min_risk=0&limit=3000'),
      apiFetch('/wallets?min_risk=0&limit=100').catch(()=>[]),
    ]).then(([g,w])=>{
      setRaw({nodes:g.nodes||[], edges:g.edges||[]});
      setWallets(w||[]);
      setLoading(false);
    }).catch(e=>{ setError(e.message); setLoading(false); });
  },[]);
  useEffect(()=>{ load(); },[load]);

  // Ресайз контейнера
  useEffect(()=>{
    if(!wrapRef.current) return;
    const ro = new ResizeObserver(entries=>{
      for(const en of entries){
        const w = Math.max(320, en.contentRect.width);
        const h = Math.max(420, en.contentRect.height);
        setDims({w,h});
      }
    });
    ro.observe(wrapRef.current);
    return ()=>ro.disconnect();
  },[]);

  const presentTypes = useMemo(()=>[...new Set(raw.nodes.map(n=>n.type))].sort(),[raw.nodes]);
  const activeTypes = selectedTypes===null ? new Set(presentTypes) : selectedTypes;

  const {nodes, edges} = useMemo(()=>{
    const nodeMap = {};
    raw.nodes.forEach(n=>{
      if((n.risk_score||0) < minRisk) return;
      if(!activeTypes.has(n.type)) return;
      nodeMap[n.id] = {...n};
    });
    const edges = raw.edges.filter(e=> nodeMap[e.source] && nodeMap[e.target]);
    // подчищаем узлы без единой связи, если их слишком много (иначе граф превращается в "пыль")
    return { nodes: Object.values(nodeMap), edges };
  },[raw, minRisk, activeTypes]);

  // ── D3 force-simulation, рисуем напрямую в SVG ──────────────────────────
  useEffect(()=>{
    if(!svgRef.current || typeof d3==='undefined') return;
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();
    if(nodes.length===0) return;

    const {w,h} = dims;
    svg.attr('viewBox', [0,0,w,h]);

    const g = svg.append('g');
    const linkG = g.append('g').attr('stroke-opacity',0.55);
    const nodeG = g.append('g');

    const zoom = d3.zoom().scaleExtent([0.15,5]).on('zoom', (ev)=>{ g.attr('transform', ev.transform); });
    svg.call(zoom);

    const simNodes = nodes.map(n=>({...n}));
    const idIndex = new Map(simNodes.map(n=>[n.id,n]));
    const simLinks = edges.map(e=>({...e, source:e.source, target:e.target}));

    const radius = (n)=> 8 + Math.min(1,Math.max(0,n.risk_score||0))*14 + Math.min(4, (n._deg||0));
    // считаем степень узла (кол-во связей) — влияет на размер
    simLinks.forEach(l=>{ const s=idIndex.get(l.source), t=idIndex.get(l.target); if(s) s._deg=(s._deg||0)+1; if(t) t._deg=(t._deg||0)+1; });

    const sim = d3.forceSimulation(simNodes)
      .force('link', d3.forceLink(simLinks).id(d=>d.id).distance(l=> 70 + (1-(l.confidence??1))*40).strength(0.5))
      .force('charge', d3.forceManyBody().strength(-260))
      .force('center', d3.forceCenter(w/2, h/2))
      .force('collide', d3.forceCollide(d=>radius(d)+6));

    const link = linkG.selectAll('line').data(simLinks).join('line')
      .attr('stroke', l => (l.risk_score||0) >= 0.6 ? '#FF2D2D' : (dark?'#555':'#bbb'))
      .attr('stroke-width', l => 1 + (l.confidence||0.5)*2);

    const linkLabel = linkG.selectAll('text').data(simLinks).join('text')
      .attr('font-size', 8)
      .attr('fill', dark?'#999':'#888')
      .attr('text-anchor','middle')
      .text(l=> l.label || '');

    const node = nodeG.selectAll('g.graph-node').data(simNodes, d=>d.id).join('g')
      .attr('class','graph-node')
      .style('cursor','pointer')
      .call(d3.drag()
        .on('start',(ev,d)=>{ if(!ev.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
        .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
        .on('end',(ev,d)=>{ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
      .on('click',(ev,d)=>{ setSelectedId(d.id); });

    node.append('circle')
      .attr('r', d=>radius(d))
      .attr('fill', d=> typeMeta(d.type).color)
      .attr('stroke', d=> String(d.id)===String(selectedId) ? (dark?'#fff':'#000') : 'rgba(0,0,0,.15)')
      .attr('stroke-width', d=> String(d.id)===String(selectedId) ? 3 : 1);

    node.append('text')
      .attr('dy', d=> radius(d)+11)
      .attr('text-anchor','middle')
      .attr('font-size', 9)
      .attr('fill', dark?'#eee':'#111')
      .text(d=> (d.label||'').length>18 ? (d.label||'').slice(0,18)+'…' : (d.label||''));

    node.append('title').text(d=> `${typeMeta(d.type).label}: ${d.label}\nриск: ${Math.round((d.risk_score||0)*100)}`);

    if(search.trim()){
      const q = search.trim().toLowerCase();
      node.style('opacity', d=> (d.label||'').toLowerCase().includes(q) ? 1 : 0.15);
      link.style('opacity', 0.12);
    }

    sim.on('tick', ()=>{
      link
        .attr('x1', d=> (typeof d.source==='object'?d.source.x:idIndex.get(d.source)?.x) || 0)
        .attr('y1', d=> (typeof d.source==='object'?d.source.y:idIndex.get(d.source)?.y) || 0)
        .attr('x2', d=> (typeof d.target==='object'?d.target.x:idIndex.get(d.target)?.x) || 0)
        .attr('y2', d=> (typeof d.target==='object'?d.target.y:idIndex.get(d.target)?.y) || 0);
      linkLabel
        .attr('x', d=> (((typeof d.source==='object'?d.source.x:idIndex.get(d.source)?.x)||0) + ((typeof d.target==='object'?d.target.x:idIndex.get(d.target)?.x)||0))/2)
        .attr('y', d=> (((typeof d.source==='object'?d.source.y:idIndex.get(d.source)?.y)||0) + ((typeof d.target==='object'?d.target.y:idIndex.get(d.target)?.y)||0))/2);
      node.attr('transform', d=> `translate(${d.x||0},${d.y||0})`);
    });

    return ()=>{ sim.stop(); };
  },[nodes, edges, dims, dark, search, selectedId]);

  // Подгружаем досье выбранной сущности
  useEffect(()=>{
    if(!selectedId){ setEntityDetail(null); return; }
    setDetailLoading(true);
    const headers = reveal ? {'X-Ingest-Token': INGEST_TOKEN} : undefined;
    apiFetch(`/entity/${selectedId}/dossier${reveal?'?reveal=true':''}`, {headers})
      .then(d=>{ setEntityDetail(d); setDetailLoading(false); })
      .catch(()=>{ setEntityDetail(null); setDetailLoading(false); });
  },[selectedId, reveal]);

  const toggleType = (t)=>{
    setSelectedTypes(prev=>{
      const base = prev===null ? new Set(presentTypes) : new Set(prev);
      if(base.has(t)) base.delete(t); else base.add(t);
      return base;
    });
  };

  if(loading) return <div style={{padding:24}}><Spinner/></div>;
  if(error) return <div style={{padding:24,color:'#FF2D2D',fontSize:12}}>Ошибка загрузки /graph: {error}</div>;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',height:'calc(100vh - 0px)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,flexWrap:'wrap'}}>
        <h1 style={{fontSize:18,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>Граф связей</h1>
        <span style={{fontSize:12,color:muted,border:`1px solid ${border}`,borderRadius:6,padding:'2px 8px'}}>{nodes.length} сущностей · {edges.length} связей</span>
        <button onClick={()=>setShowHelp(s=>!s)} style={{fontSize:11,padding:'4px 10px',border:`1px solid ${border}`,borderRadius:8,background:'transparent',color:dark?'#fff':'#000',fontFamily:'inherit'}}>{showHelp?'Скрыть объяснение':'ⓘ Как это работает'}</button>
        <button onClick={load} style={{marginLeft:'auto',fontSize:11,padding:'4px 10px',border:`1px solid ${border}`,borderRadius:8,background:'transparent',color:dark?'#fff':'#000',fontFamily:'inherit'}}>↻ Обновить</button>
      </div>

      {showHelp && (
        <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:16,marginBottom:14,fontSize:12,lineHeight:1.7}}>
          <b>Как строится граф.</b> Каждая точка (узел) — это «сущность»: канал, человек, крипто-кошелёк,
          телефон, домен и т.д. Линия (связь) появляется, если при отправке данных на <span className="code-text" style={{fontFamily:'monospace'}}>/ingest</span> в
          массивах <span style={{fontFamily:'monospace'}}>entities[]</span> и <span style={{fontFamily:'monospace'}}>relations[]</span> одного поста
          указаны две сущности и тип связи между ними (например «PROMOTES», «OWNS», «USES_WALLET»).
          Один и тот же канал/кошелёк/телефон, встреченный в разных постах, автоматически "схлопывается" в один и тот же узел
          (сервер ищет совпадение по нормализованному значению) — поэтому граф со временем сам достраивается и показывает,
          где разные объявления и площадки на самом деле связаны одними и теми же людьми, кошельками или номерами.
        </div>
      )}

      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Найти узел (имя, username, кошелёк...)" style={{flex:'1 1 220px',height:34,padding:'0 12px',background:dark?'#1a1a1a':'#fafaf8',border:`1px solid ${border}`,borderRadius:8,fontSize:12,fontFamily:'inherit',color:dark?'#fff':'#000',outline:'none'}}/>
        <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:muted}}>
          мин. риск
          <input type="range" min="0" max="100" value={Math.round(minRisk*100)} onChange={e=>setMinRisk(Number(e.target.value)/100)} />
          <span style={{width:26}}>{Math.round(minRisk*100)}</span>
        </div>
        {selectedTypes!==null && <button onClick={()=>setSelectedTypes(null)} style={{fontSize:11,padding:'4px 10px',border:`1px solid ${border}`,borderRadius:8,background:'transparent',color:dark?'#fff':'#000',fontFamily:'inherit'}}>Сбросить фильтр типов</button>}
      </div>

      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
        {presentTypes.map(t=>{
          const on = activeTypes.has(t);
          const meta = typeMeta(t);
          return (
            <span key={t} className="graph-legend-chip" onClick={()=>toggleType(t)} style={{
              background: on ? meta.color+'22' : 'transparent',
              border: `1px solid ${on?meta.color:border}`,
              color: on ? meta.color : muted,
              opacity: on?1:0.55,
            }}>
              <span style={{width:8,height:8,borderRadius:'50%',background:meta.color,display:'inline-block'}}/>
              {meta.label}
            </span>
          );
        })}
        {presentTypes.length===0 && <span style={{fontSize:11,color:muted}}>Сущностей пока нет — граф заполнится, когда парсер начнёт присылать entities[]/relations[] в /ingest</span>}
      </div>

      <div style={{flex:1,minHeight:420,display:'grid',gridTemplateColumns: selectedId? '1fr 320px' : '1fr', gap:14}}>
        <div ref={wrapRef} className="graph-canvas-wrap" style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12}}>
          {nodes.length===0 ? (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:muted,fontSize:12,textAlign:'center',padding:20}}>
              Нет узлов по текущим фильтрам.<br/>Если сущностей в БД нет вовсе — добавьте entities[] и relations[] в payload /ingest (см. пример ниже в подсказке «Как это работает»).
            </div>
          ) : (
            <svg ref={svgRef} width="100%" height={dims.h} style={{display:'block'}}/>
          )}
        </div>

        {selectedId && (
          <div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:16,overflowY:'auto',maxHeight:dims.h}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>Карточка сущности</div>
              <button onClick={()=>setSelectedId(null)} style={{border:'none',background:'transparent',fontSize:14,color:muted}}>✕</button>
            </div>
            {detailLoading && <Spinner/>}
            {!detailLoading && entityDetail && (()=>{ const e = entityDetail.entity; const meta = typeMeta(e.entity_type); return (
              <div style={{fontSize:12,lineHeight:1.6}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <span style={{width:10,height:10,borderRadius:'50%',background:meta.color,display:'inline-block'}}/>
                  <b style={{fontSize:13,wordBreak:'break-all'}}>{e.value || e.display_value}</b>
                </div>
                <div style={{color:muted,marginBottom:6}}>{meta.label}{e.category?` · ${e.category}`:''}{e.city?` · ${e.city}`:''}</div>
                <div style={{marginBottom:10}}><RiskBadge score={Math.round((e.risk_score||0)*100)}/></div>

                {e.entity_type==='WALLET' && !reveal && (
                  <button onClick={()=>setReveal(true)} style={{fontSize:10,padding:'4px 8px',border:`1px solid ${border}`,borderRadius:6,background:'transparent',color:dark?'#fff':'#000',marginBottom:10}}>🔓 Показать полный адрес (требует токен)</button>
                )}

                <div style={{fontSize:10,textTransform:'uppercase',color:muted,marginTop:12,marginBottom:6}}>Связи ({entityDetail.relations?.length||0})</div>
                {(!entityDetail.relations || entityDetail.relations.length===0) && <div style={{color:muted,fontSize:11}}>Связей не найдено</div>}
                {(entityDetail.relations||[]).map(r=>(
                  <div key={r.id} onClick={()=>setSelectedId(String(r.related_id))} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:6,padding:'6px 8px',border:`1px solid ${border}`,borderRadius:6,marginBottom:6}}>
                    <span style={{width:8,height:8,borderRadius:'50%',background:typeMeta(r.related_type).color,flexShrink:0}}/>
                    <div style={{minWidth:0,flex:1}}>
                      <div style={{fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.direction==='OUT'?'→':'←'} {r.related_value}</div>
                      <div style={{fontSize:9,color:muted}}>{r.relation_type}{r.description?` · ${r.description}`:''}</div>
                    </div>
                  </div>
                ))}

                <div style={{fontSize:10,textTransform:'uppercase',color:muted,marginTop:12,marginBottom:6}}>Упоминания в постах ({entityDetail.posts?.length||0})</div>
                {(entityDetail.posts||[]).slice(0,10).map(p=>(
                  <div key={p.id} style={{padding:'6px 8px',border:`1px solid ${border}`,borderRadius:6,marginBottom:6}}>
                    <div style={{fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title||p.explanation||'Без заголовка'}</div>
                    <div style={{fontSize:9,color:muted}}>{p.source_name} · {p.source_type}{p.role?` · роль: ${p.role}`:''}</div>
                    {p.url && <a href={p.url} target="_blank" rel="noopener noreferrer" style={{fontSize:9,color:'#2563eb'}}>Открыть пост ↗</a>}
                  </div>
                ))}
              </div>
            );})()}
            {!detailLoading && !entityDetail && <div style={{color:muted,fontSize:11}}>Не удалось загрузить карточку</div>}
          </div>
        )}
      </div>

      {wallets.length>0 && (
        <div style={{marginTop:16,background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:16}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:10}}>💰 Крипто-кошельки в базе ({wallets.length})</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8}}>
            {wallets.map(w=>(
              <div key={w.id} onClick={()=>setSelectedId(String(w.id))} style={{cursor:'pointer',border:`1px solid ${border}`,borderRadius:8,padding:'8px 10px',display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:'#f59e0b',flexShrink:0}}/>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:11,fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w.display_value}</div>
                  <div style={{fontSize:9,color:muted}}>{w.mention_count} упоминаний{w.category?` · ${w.category}`:''}</div>
                </div>
                <RiskBadge score={Math.round((w.risk_score||0)*100)}/>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
 
// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState('overview');
  const [dossiers,setDossiers]=useState([]);
  const [alerts,setAlerts]=useState([]);
  const [liveItems,setLiveItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [search,setSearch]=useState('');
  const [filterVerdict,setFilterVerdict]=useState('all');
  const [filterSource,setFilterSource]=useState('all');
  const [sortBy,setSortBy]=useState('risk');
  const [selected,setSelected]=useState(null);
  const [lastSync,setLastSync]=useState(null);
  const [syncing,setSyncing]=useState(false);
 
  const load=useCallback((silent=false)=>{
    if(silent){ setSyncing(true); } else { setLoading(true); }
    setError(null);
    Promise.all([loadAll(),apiFetch('/alerts?unread_only=false&limit=50').catch(()=>[])])
      .then(([d,a])=>{
        setDossiers(d);
        setAlerts(a);
        const items=a.slice(0,30).map((al,i)=>({
          id:String(al.id||i),
          time:new Date(al.created_at||Date.now()).toLocaleTimeString('ru'),
          title:al.title||al.message||'—',
          risk:Math.round((al.risk_score||0)*100),
          username:al.source_username||'—',
        }));
        setLiveItems(items);
        setLoading(false);
        setSyncing(false);
        setLastSync(new Date());
      })
      .catch(e=>{setError(e.message);setLoading(false);setSyncing(false);});
  },[]);
 
  useEffect(()=>{ load(false); },[load]);
  useEffect(()=>{ const t=setInterval(()=>{ load(true); },20000); return ()=>clearInterval(t); },[load]);
  useEffect(()=>{
    const t=setInterval(()=>{
      apiFetch('/alerts?unread_only=false&limit=50').then(a=>{
        setAlerts(a);
        setLiveItems(prev=>{
          const newItems=a.slice(0,5).map((al,i)=>({
            id:String(al.id||i),time:new Date(al.created_at||Date.now()).toLocaleTimeString('ru'),
            title:al.title||al.message||'—',risk:Math.round((al.risk_score||0)*100),username:al.source_username||'—',
          }));
          const ids=new Set(prev.map(x=>x.id));
          return [...newItems.filter(x=>!ids.has(x.id)),...prev].slice(0,60);
        });
      }).catch(()=>{});
    },15000);
    return ()=>clearInterval(t);
  },[]);
 
  const stats=useMemo(()=>({ total:dossiers.length, dangerous:dossiers.filter(d=>d.verdict==='dangerous').length, suspicious:dossiers.filter(d=>d.verdict==='suspicious').length, safe:dossiers.filter(d=>d.verdict==='safe').length }),[dossiers]);
  const filtered=useMemo(()=>{
    let list=[...dossiers];
    if(search){const q=search.toLowerCase();list=list.filter(d=>d.username.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||d.cats.some(c=>c.toLowerCase().includes(q)));}
    if(filterVerdict!=='all')list=list.filter(d=>d.verdict===filterVerdict);
    if(filterSource!=='all')list=list.filter(d=>d.source_type===filterSource);
    if(sortBy==='risk')list.sort((a,b)=>b.riskPct-a.riskPct);
    else if(sortBy==='participants')list.sort((a,b)=>b.participants-a.participants);
    return list;
  },[dossiers,search,filterVerdict,filterSource,sortBy]);
 
  const analytics=useMemo(()=>{
    const dayMap={}; const now=new Date(); for(let i=13;i>=0;i--){ const d=new Date(now);d.setDate(d.getDate()-i); dayMap[d.toISOString().slice(0,10)]=0; }
    const days7=[]; for(let i=6;i>=0;i--){ const d=new Date(now);d.setDate(d.getDate()-i); days7.push(d.toISOString().slice(0,10)); }
    const spark={total:days7.map(()=>0),dangerous:days7.map(()=>0),suspicious:days7.map(()=>0),safe:days7.map(()=>0)};
    const catMap={},kwMap={},srcMap={}; let totalViews=0,totalForwards=0,totalPosts=0,dangerousReach=0;
    dossiers.forEach(d=>{ srcMap[d.source_type]=(srcMap[d.source_type]||0)+1; d.cats.forEach(c=>{catMap[c]=(catMap[c]||0)+1;}); d.kws.forEach(k=>{kwMap[k]=(kwMap[k]||0)+1;}); if(d.verdict==='dangerous')dangerousReach+=d.participants||0; d.messages.forEach(m=>{ totalPosts++; totalViews+=m.views||0; totalForwards+=m.forwards||0; if(m.date){ const key=new Date(m.date).toISOString().slice(0,10); if(key in dayMap)dayMap[key]++; const idx7=days7.indexOf(key); if(idx7>-1){spark.total[idx7]++;spark[d.verdict][idx7]++;}} }); });
    const days=Object.entries(dayMap); const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,8); const catTotal=Object.values(catMap).reduce((a,b)=>a+b,0)||1;
    
    const topCatsPct=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cat,val])=>({cat,val,pct:Math.round(val/catTotal*100)}));
    
    const topKws=Object.entries(kwMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const sources=Object.entries(srcMap).sort((a,b)=>b[1]-a[1]);
    const topByParticipants=[...dossiers].sort((a,b)=>b.participants-a.participants).slice(0,8);
    const avgPostsPerChannel=dossiers.length>0?(totalPosts/dossiers.length):0;
    const todayCounts={total:spark.total[6],dangerous:spark.dangerous[6],suspicious:spark.suspicious[6],safe:spark.safe[6]};
    return{days,days7,spark,todayCounts,topCats,topCatsPct,topKws,sources,topByParticipants,totalViews,totalForwards,totalPosts,avgPostsPerChannel,dangerousReach};
  },[dossiers]);
 
  const bg=dark?'#0a0a0a':'#f8f8f6'; const cardBg=dark?'#121212':'#fff'; const border=dark?'#2a2a2a':'#e5e5e5'; const muted=dark?'#888':'#666'; const sidebarBg=dark?'#0a0a0a':'#f8f8f6';
  const navItems=[
    {k:'overview',label:'Обзор',count:null},
    {k:'dossiers',label:'Досье',count:stats.total},
    {k:'graph',label:'Граф связей',count:null},
    {k:'analytics',label:'Аналитика',count:null},
    {k:'live',label:'LIVE лента',count:alerts.length,pulse:true},
  ];

>{kw}</span><span style={{color:muted}}>{val}</span></div><div style={{height:6,borderRadius:4,background:dark?'#2a2a2a':'#f0f0f0',overflow:'hidden'}}><div style={{height:'100%',width:`${val/maxKw*100}%`,background:'#FFB800',borderRadius:4}}/></div></div>))}</div></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}><div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}><div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.15em',color:muted,marginBottom:16}}>Каналы по источнику</div>{analytics.sources.length===0&&<div style={{color:muted,fontSize:12,textAlign:'center',padding:'20px 0'}}>Нет данных</div>}{analytics.sources.map(([src,val])=>(<div key={src} style={{marginBottom:10}}><div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4}}><span>{srcLabel[src]||src}</span><span style={{color:muted}}>{val}</span></div><div style={{height:6,borderRadius:4,background:dark?'#2a2a2a':'#f0f0f0',overflow:'hidden'}}><div style={{height:'100%',width:`${val/maxSrc*100}%`,background:dark?'#fff':'#000',borderRadius:4}}/></div></div>))}</div><div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20}}><div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.15em',color:muted,marginBottom:16}}>Топ каналов по охвату</div>{analytics.topByParticipants.length===0&&<div style={{color:muted,fontSize:12,textAlign:'center',padding:'20px 0'}}>Нет данных</div>}{analytics.topByParticipants.map((d,i)=>(<div key={d.id} onClick={()=>setSelected(d)} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:i<analytics.topByParticipants.length-1?`1px solid ${border}`:'none',cursor:'pointer'}}><div style={{fontSize:11,color:muted,width:16,textAlign:'right'}}>{i+1}</div><Dot verdict={d.verdict}/><div style={{flex:1,minWidth:0,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.title}</div><div style={{fontSize:11,color:muted,flexShrink:0}}>{d.participants>0?d.participants.toLocaleString():'—'}</div></div>))}</div></div><div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:20,marginTop:20}}><div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.15em',color:muted,marginBottom:16}}>Топ опасных каналов</div>{dossiers.filter(d=>d.verdict==='dangerous').sort((a,b)=>b.riskPct-a.riskPct).slice(0,8).map((d,i)=>(<div key={d.id} onClick={()=>setSelected(d)} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:`1px solid ${border}`,cursor:'pointer'}}><div style={{fontSize:12,color:muted,width:20,textAlign:'right'}}>{i+1}</div><div style={{width:32,height:32,borderRadius:8,background:'#FF2D2D',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:13,flexShrink:0}}>{(d.title[0]||'?').toUpperCase()}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.title}</div><div style={{fontSize:11,color:muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>@{d.username} · {d.source_type}</div></div><div style={{flexShrink:0}}><RiskBadge score={d.riskPct}/></div><span style={{fontSize:11,color:'#FF2D2D',flexShrink:0}}>→</span></div>))}{dossiers.filter(d=>d.verdict==='dangerous').length===0&&<div style={{color:muted,fontSize:12,textAlign:'center',padding:'20px 0'}}>Опасных каналов не обнаружено</div>}</div></div>);})()}
        {tab==='live'&&(<div style={{padding:24}}><div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,flexWrap:'wrap'}}><span style={{width:10,height:10,borderRadius:'50%',background:'#FF2D2D',animation:'pulseLive 1s infinite',display:'inline-block'}}/><h1 style={{fontSize:18,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>LIVE Лента алертов</h1><span style={{fontSize:12,color:muted,border:`1px solid ${border}`,borderRadius:6,padding:'2px 8px'}}>{liveItems.length}</span><button onClick={()=>setLiveItems([])} style={{marginLeft:'auto',padding:'6px 14px',border:`1px solid ${border}`,borderRadius:8,background:'transparent',color:dark?'#fff':'#000',cursor:'pointer',fontSize:11,fontFamily:'inherit'}}>Очистить</button></div><div style={{maxWidth:900,display:'flex',flexDirection:'column',gap:8}}>{liveItems.length===0&&(<div style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:40,textAlign:'center',color:muted,fontSize:12}}>Алертов нет. Данные обновляются каждые 15 секунд из /alerts</div>)}{liveItems.map(item=>(<div key={item.id} style={{background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:14,display:'flex',gap:12,animation:'slideIn .3s both'}}><div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flexShrink:0}}><span style={{width:7,height:7,borderRadius:'50%',background:'#FF2D2D',animation:'pulseLive 1s infinite',display:'inline-block'}}/><span style={{fontSize:9,color:muted}}>{item.time}</span></div><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}><span style={{fontSize:12,fontWeight:700}}>@{item.username}</span><RiskBadge score={item.risk}/>{item.risk>90&&<span style={{fontSize:10,color:'#FF2D2D'}}>⚠️ ВЫСОКИЙ РИСК</span>}</div><div style={{fontSize:12,color:dark?'#ccc':'#333',lineHeight:1.4}}>{item.title}</div></div></div>))}</div><div style={{marginTop:20,background:cardBg,border:`1px solid ${border}`,borderRadius:12,padding:16,maxWidth:900}}><div style={{fontSize:11,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:'0.1em'}}>API источник</div><div style={{fontSize:11,color:muted,lineHeight:1.8}}><div>GET {API}/alerts?unread_only=false&limit=50</div><div>Автообновление каждые 15 секунд</div></div></div></div>)}
      </main>
      {selected&&<DossierModal d={selected} dark={dark} border={border} onClose={()=>setSelected(null)}/>}
    
        </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
